# ========================================================
# SERVER
# ========================================================
server.port=9090

# ========================================================
# MYSQL DATABASE CONFIGURATION
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_quan_an?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# JPA / HIBERNATE
# ========================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# SWAGGER / OPENAPI (Giao diện test API)
# ========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ========================================================
# JWT CONFIGURATION
# ========================================================
# Thay thế bằng một chuỗi bí mật dài hơn trong thực tế
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Thời gian hết hạn (ví dụ: 86400000 = 1 ngày)
jwt.expiration=86400000

# ========================================================
# FIXED SPRING SECURITY LOGIN
# ========================================================
spring.security.user.name=admin
spring.security.user.password=123456
